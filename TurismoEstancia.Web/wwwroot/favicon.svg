    <rect x="10" y="37" width="44" height="6" rx="3" fill="#658746" />
    <rect x="10" y="46" width="44" height="6" rx="3" fill="#0095F6" />
    <rect x="10" y="55" width="44" height="6" rx="3" fill="#E9568A" />
